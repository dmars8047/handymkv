name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all platforms
        run: make all

      - name: Rename binaries for release
        run: |
          mv bin/linux-amd64/handymkv   bin/handymkv-linux-amd64
          mv bin/linux-arm64/handymkv   bin/handymkv-linux-arm64
          mv bin/darwin-amd64/handymkv  bin/handymkv-darwin-amd64
          mv bin/darwin-arm64/handymkv  bin/handymkv-darwin-arm64
          mv bin/windows-amd64/handymkv.exe bin/handymkv-windows-amd64.exe
          mv bin/windows-arm64/handymkv.exe bin/handymkv-windows-arm64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/handymkv-linux-amd64
            bin/handymkv-linux-arm64
            bin/handymkv-darwin-amd64
            bin/handymkv-darwin-arm64
            bin/handymkv-windows-amd64.exe
            bin/handymkv-windows-arm64.exe
