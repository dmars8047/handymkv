name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: make windows-amd64 linux-amd64

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: handymkv-windows-amd64
          path: bin/windows-amd64/handymkv.exe

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: handymkv-linux-amd64
          path: bin/linux-amd64/handymkv
